[workspace]
resolver = "3"
default-members = ["apps/x-chaos"]
members = [
    "apps/x-chaos",
    "crates/*",
    "crates/emulators/nintendo/nes",
]

[workspace.package]
version = "0.1.0"
authors = ["Nguyễn Quý Ngọc"]
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChaoswareHQ/x-chaos"
homepage = "https://github.com/ChaoswareHQ/x-chaos"
documentation = "https://chaoswarehq.github.io/x-chaos/"
readme = "README.md"

[workspace.dependencies]
base        = { path = "crates/base" }
audio       = { path = "crates/audio" }
controller  = { path = "crates/controller" }
emulators   = { path = "crates/emulators" }
ffi         = { path = "crates/ffi" }
gfx         = { path = "crates/gfx" }
network     = { path = "crates/network" }

x-gfx        = "0.1.0"
x-audio      = "0.1.0"
x-controller = "0.1.0"
x-nes        = "0.1.1"

libloading = "0.8"
anyhow = "1.0.103"
